# The Font Manager, as a native module (modules/fontmanager): every SWI is
# register-level and raw, as in RISC OS 5.
#
# Names, numbers and registers are facts of RISC OS 5's interface
# (Video/Render/Fonts/FontManager); the comments are ours.  reads and
# writes are widened to R0-R7, which covers every SWI's registers.
# Font_ChangeArea (&400BF, called by OS_ChangeDynamicArea) has no name in
# the original's table either.

[module]
name = "FontManager"
impl = "native"
chunk = 0x40080

[[swi]]
name = "Font_CacheAddr"
number = 0x40080
raw = true
reads = [0, 1, 2, 3, 4, 5, 6, 7]
writes = [0, 1, 2, 3, 4, 5, 6, 7]

