# Portable, as a native module (modules/portable): PortableHAL 0.81, the Pi
# ROM's, on a machine with no CPU clock device and no battery -- the box.
#
# Names, numbers and the chunk are facts of RISC OS 5's interface
# (HWSupport/PortableHAL, s/StPortable); the comments are ours.  Every SWI
# is register-level: each keeps what it does not write.

[module]
name = "Portable"
impl = "native"
chunk = 0x42FC0

[[swi]]
name = "Portable_Speed"
number = 0x42FC0
raw = true
reads = [0, 1, 2, 3]
writes = [0, 1, 2, 3]

