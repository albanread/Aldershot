# AcornHTTP, as a native module over libcurl (modules/acornhttp): its SWIs
# are register-level, raw, as RISC OS 5's AcornHTTP 1.09 takes them
# (Docs/SWIs, SWInums, AddMethds).  GetData, Status, ReadData and Stop are
# the protocol module interface URL_Fetcher calls (Docs/APISpec); the
# Secure ones the same for https:; the cookie SWIs and the method
# registration sit at the top of the chunk.

[module]
name = "AcornHTTP"
impl = "native"
chunk = 0x83F80

[[swi]]
name = "HTTP_GetData"
number = 0x83F80
raw = true
reads = [0, 1, 2, 3, 4, 5, 6, 7]
writes = [0, 1, 2, 3, 4, 5, 6, 7]

