# GDraw, as a native module (modules/gdraw): the anti-aliasing Draw.
# Every SWI is register-level and raw.  SWIs 0-11 are Draw's, with the same
# registers; 12-24 are GDraw's own.  The three unnamed reasons 61-63 (read,
# claim and release DrawV) are not in the name table: the module's own
# thunk table carries them (modules/gdraw/gdraw.c).
#
# Names, numbers and registers are facts of the module's interface, as the
# specification records them; the comments are ours.  reads and writes are
# widened to R0-R7, which covers every SWI's registers.

[module]
name = "GDraw"
impl = "native"
chunk = 0x44540

[[swi]]
name = "GDraw_ProcessPath"
number = 0x44540
raw = true
reads = [0, 1, 2, 3, 4, 5, 6, 7]
writes = [0, 1, 2, 3, 4, 5, 6, 7]

