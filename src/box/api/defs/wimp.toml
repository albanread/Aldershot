# The Window Manager: its SWIs, planned -- defined, not implemented yet.
#
# Names, numbers and registers are facts of RISC OS 5's interface; the
# comments are ours.  `reads` and `writes` are every register a SWI may read
# and write, for any reason, widened where in doubt (see os.toml).

[module]
name = "WindowManager"
impl = "planned"
chunk = 0x400C0

# R0 = the version known, R1 = "TASK", R2 -> name, R3 -> messages; out R0 = version, R1 = task.
[[swi]]
name = "Wimp_Initialise"
number = 0x400C0
reads = [0, 1, 2, 3]
writes = [1]

[[swi]]
name = "Wimp_CreateWindow"
number = 0x400C1
params = [
  { reg = 1, name = "block", type = "ptr<void>" },
]
results = [
  { reg = 0, name = "window", type = "u32" },
]

[[swi]]
name = "Wimp_CreateIcon"
number = 0x400C2
params = [
  { reg = 0, name = "priority", type = "u32" },
  { reg = 1, name = "block", type = "ptr<void>" },
]
results = [
  { reg = 0, name = "icon", type = "u32" },
]

[[swi]]
name = "Wimp_DeleteWindow"
number = 0x400C3
