# The Internet module, as a native module over Linux's sockets: its SWIs, typed.
#
# The interface is RISC OS 5's Internet module (Networking/AUN/Internet: its
# cmhg header, riscos/c/socket_swi, and TCPIPLibs' headers); modules/internet/
# README.md describes the module.  Names, numbers, register roles, constants and
# structure layouts are RISC OS's -- 4.4BSD's -- and the module translates each
# to Linux's.
#
# Each SWI is the BSD call of its name, arguments in R0 upwards and the result
# in R0.  The unsuffixed Accept, Recvfrom, Recvmsg, Sendmsg, Getpeername and
# Getsockname are 4.3BSD's, with 4.3's sockaddr (a 16-bit family) and msghdr;
# the _1 forms are 4.4BSD's (length and family bytes).  Errors are
# &20E00 + the BSD errno.
#
# Sockets are small integers, 0 to 255 -- machine-wide, as on RISC OS, where
# a socket one task opens another may use.

[module]
name = "Internet"
impl = "native"
chunk = 0x41200

[[swi]]
name = "Socket_Creat"
number = 0x41200
params = [
  { reg = 0, name = "domain", type = "u32" },
  { reg = 1, name = "type", type = "u32" },
  { reg = 2, name = "protocol", type = "u32" },
]
results = [{ reg = 0, name = "sock", type = "u32" }]

[[swi]]
name = "Socket_Bind"
number = 0x41201
params = [
  { reg = 0, name = "s", type = "u32" },
  { reg = 1, name = "name", type = "ptr<u8>", const = true },
  { reg = 2, name = "namelen", type = "u32" },
]

[[swi]]
name = "Socket_Listen"
number = 0x41202
params = [
  { reg = 0, name = "s", type = "u32" },
  { reg = 1, name = "backlog", type = "u32" },
]

[[swi]]
name = "Socket_Accept"
number = 0x41203
params = [
  { reg = 0, name = "s", type = "u32" },
  { reg = 1, name = "addr", type = "ptr<u8>", null_ok = true },
  { reg = 2, name = "addrlen", type = "ptr<u32>", null_ok = true },
]
results = [{ reg = 0, name = "ns", type = "u32" }]

[[swi]]
name = "Socket_Connect"
number = 0x41204
params = [
  { reg = 0, name = "s", type = "u32" },
  { reg = 1, name = "name", type = "ptr<u8>", const = true },
  { reg = 2, name = "namelen", type = "u32" },
]

[[swi]]
name = "Socket_Recv"
number = 0x41205
params = [
  { reg = 0, name = "s", type = "u32" },
  { reg = 1, name = "buf", type = "ptr<u8>" },
  { reg = 2, name = "len", type = "u32" },
  { reg = 3, name = "flags", type = "u32" },
]
results = [{ reg = 0, name = "n", type = "u32" }]

[[swi]]
name = "Socket_Recvfrom"
number = 0x41206
params = [
  { reg = 0, name = "s", type = "u32" },
  { reg = 1, name = "buf", type = "ptr<u8>" },
  { reg = 2, name = "len", type = "u32" },
  { reg = 3, name = "flags", type = "u32" },
  { reg = 4, name = "from", type = "ptr<u8>", null_ok = true },
  { reg = 5, name = "fromlen", type = "ptr<u32>", null_ok = true },
]
results = [{ reg = 0, name = "n", type = "u32" }]

[[swi]]
name = "Socket_Recvmsg"
number = 0x41207
params = [
  { reg = 0, name = "s", type = "u32" },
  { reg = 1, name = "msg", type = "ptr<u32>" },     # 4.3's msghdr, six words
  { reg = 2, name = "flags", type = "u32" },
]
results = [{ reg = 0, name = "n", type = "u32" }]

[[swi]]
name = "Socket_Send"
number = 0x41208
