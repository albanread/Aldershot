# fd_sets of 256 bits; a 4.4BSD timeval of two 32-bit words, NULL to wait.
[[swi]]
name = "Socket_Select"
number = 0x41211
params = [
  { reg = 0, name = "nfds", type = "u32" },
  { reg = 1, name = "readfds", type = "ptr<u32>", null_ok = true },
  { reg = 2, name = "writefds", type = "ptr<u32>", null_ok = true },
  { reg = 3, name = "exceptfds", type = "ptr<u32>", null_ok = true },
  { reg = 4, name = "timeout", type = "ptr<u32>", const = true, null_ok = true },
]
results = [{ reg = 0, name = "n", type = "u32" }]

[[swi]]
name = "Socket_Ioctl"
number = 0x41212
params = [
  { reg = 0, name = "s", type = "u32" },
  { reg = 1, name = "request", type = "u32" },
  { reg = 2, name = "argp", type = "ptr<u8>", null_ok = true },
]

