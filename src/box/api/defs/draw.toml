# Draw, as a native module (modules/draw): every SWI is register-level, raw,
# and goes through DrawV as in RISC OS 5.
#
# Names, numbers and registers are facts of RISC OS 5's interface
# (Video/Render/DrawMod); the comments are ours.  reads and writes are
# widened to R0-R7, which covers every SWI's registers.

[module]
name = "Draw"
impl = "native"
chunk = 0x40700

[[swi]]
name = "Draw_ProcessPath"
number = 0x40700
raw = true
reads = [0, 1, 2, 3, 4, 5, 6, 7]
writes = [0, 1, 2, 3, 4, 5, 6, 7]

