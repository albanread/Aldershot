# ColourTrans, as a native module (modules/colourtrans): every SWI is
# register-level, raw, and goes through ColourV as in RISC OS 5.
#
# Names, numbers and registers are facts of RISC OS 5's interface
# (Video/Render/Colours); the comments are ours.  reads and writes are
# widened to R0-R7, which covers every SWI's registers.

[module]
name = "ColourTrans"
impl = "native"
chunk = 0x40740

[[swi]]
name = "ColourTrans_SelectTable"
number = 0x40740
raw = true
reads = [0, 1, 2, 3, 4, 5, 6, 7]
writes = [0, 1, 2, 3, 4, 5, 6, 7]

